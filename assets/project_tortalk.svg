<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd00ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#09090d" rx="8" />
  
  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.02)" stroke-width="1">
    <path d="M 0,50 L 600,50 M 0,100 L 600,100 M 0,150 L 600,150 M 0,200 L 600,200 M 0,250 L 600,250 M 0,300 L 600,300 M 0,350 L 600,350" />
    <path d="M 50,0 L 50,400 M 100,0 L 100,400 M 150,0 L 150,400 M 200,0 L 200,400 M 250,0 L 250,400 M 300,0 L 300,400 M 350,0 L 350,400 M 400,0 L 400,400 M 450,0 L 450,400 M 500,0 L 500,400 M 550,0 L 550,400" />
  </g>

  <!-- Title & Headers -->
  <text x="40" y="50" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10" letter-spacing="2">PROJECT_MOCKUP // PORT 9050</text>
  <text x="40" y="80" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="22" letter-spacing="1">TorTalk Decentralized P2P</text>
  <text x="40" y="105" fill="#bd00ff" font-family="monospace" font-size="12" filter="url(#glow)">STATUS: ROUTING OVER ONION NETWORK</text>

  <!-- Network Nodes representation -->
  <g transform="translate(120, 160)">
    <!-- Main Node circles -->
    <circle cx="180" cy="90" r="45" fill="rgba(189, 0, 255, 0.05)" stroke="url(#purpleGlow)" stroke-width="2" filter="url(#glow)" />
    <circle cx="60" cy="140" r="30" fill="rgba(0, 240, 255, 0.05)" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="300" cy="140" r="30" fill="rgba(0, 240, 255, 0.05)" stroke="#00f0ff" stroke-width="1.5" />
    
    <!-- Connection lines -->
    <line x1="60" y1="140" x2="180" y2="90" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2" stroke-dasharray="5 3" />
    <line x1="180" y1="90" x2="300" y2="140" stroke="rgba(189, 0, 255, 0.3)" stroke-width="2" stroke-dasharray="5 3" />
    <line x1="60" y1="140" x2="300" y2="140" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

    <!-- Terminal screen simulation inside Main Node -->
    <path d="M 155,75 L 205,75 L 205,105 L 155,105 Z" fill="#09090d" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="160" y="87" fill="#00f0ff" font-family="monospace" font-size="6">E2EE: OK</text>
    <text x="160" y="97" fill="#bd00ff" font-family="monospace" font-size="6">TOR: ACT</text>

    <!-- Node labels -->
    <text x="180" y="150" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">Onion Router Node</text>
    <text x="60" y="185" fill="rgba(255,255,255,0.6)" font-family="monospace" font-size="8" text-anchor="middle">Peer A (Local)</text>
    <text x="300" y="185" fill="rgba(255,255,255,0.6)" font-family="monospace" font-size="8" text-anchor="middle">Peer B (Remote)</text>
  </g>

  <!-- Lock icon in the center -->
  <g transform="translate(280, 205)" stroke="#00f0ff" stroke-width="2" fill="none">
    <rect x="12" y="18" width="16" height="12" rx="2" fill="rgba(0, 240, 255, 0.1)" />
    <path d="M 15,18 L 15,13 C 15,10 25,10 25,13 L 25,18" />
  </g>
</svg>
