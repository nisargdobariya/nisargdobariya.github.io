<svg width="800" height="565" viewBox="0 0 800 565" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="elevateGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background border frame -->
  <rect x="0" y="0" width="800" height="565" fill="#0d0d12" rx="10" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <rect x="15" y="15" width="770" height="535" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" rx="8" />

  <!-- Logo and Headers -->
  <g transform="translate(100, 80)">
    <text x="0" y="22" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="20" letter-spacing="1">ELEVATE LABS</text>
    <text x="0" y="48" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10" letter-spacing="1">INTERNSHIP &amp; RESILIENCE LABS</text>
  </g>

  <!-- Certificate Main Content -->
  <g transform="translate(100, 180)">
    <text x="0" y="0" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="14" font-weight="300">This is to certify that</text>
    <text x="0" y="40" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="30" letter-spacing="1">NISARG DOBARIYA</text>
    <line x1="0" y1="60" x2="600" y2="60" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <text x="0" y="95" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="13" font-weight="300">has successfully completed the specialized internship program in</text>
    <text x="0" y="130" fill="url(#elevateGlow)" font-family="sans-serif" font-weight="800" font-size="22" filter="url(#glow)">Cyber Security Internship (Best Performer)</text>
    
    <text x="0" y="160" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11">Demonstrated exceptional skills and dedication in contributing to real-world security projects</text>
    <text x="0" y="176" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11">and tasks, showing outstanding commitment and analytical thinking. Duration: 26 May 2025 to 28 June 2025.</text>
  </g>

  <!-- Footer, Signatures, and Seal -->
  <g transform="translate(100, 440)">
    <!-- Signature Left -->
    <line x1="0" y1="30" x2="160" y2="30" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="80" y="48" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="10" text-anchor="middle">CEO &amp; CO-FOUNDERS</text>
    <text x="80" y="20" fill="#00f0ff" font-family="cursive" font-size="14" text-anchor="middle" opacity="0.8">Elevate Labs HR</text>
    
    <!-- Code ID Right -->
    <text x="600" y="25" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">VERIFICATION INQUIRY: hr@elevate-labs.info</text>
    <text x="600" y="45" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">PERFORMANCE STATUS: BEST PERFORMER</text>

    <!-- Badge Center -->
    <g transform="translate(320, -30)">
      <circle cx="30" cy="30" r="32" fill="rgba(0,240,255,0.05)" stroke="url(#elevateGlow)" stroke-width="2" />
      <polygon points="30,8 35,22 48,22 38,30 42,42 30,34 18,42 22,30 12,22 25,22" fill="#bd00ff" filter="url(#glow)" />
    </g>
  </g>
</svg>
