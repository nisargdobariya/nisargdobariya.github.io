<svg width="800" height="565" viewBox="0 0 800 565" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nptelGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffd43b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background border frame -->
  <rect x="0" y="0" width="800" height="565" fill="#0d0d12" rx="10" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <rect x="15" y="15" width="770" height="535" fill="none" stroke="rgba(255, 212, 59, 0.2)" stroke-width="1" rx="8" />

  <!-- Logo and Headers -->
  <g transform="translate(100, 80)">
    <text x="0" y="22" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="20" letter-spacing="1">NPTEL ONLINE CERTIFICATION</text>
    <text x="0" y="48" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10" letter-spacing="1">IIT MADRAS / MINISTRY OF EDUCATION, INDIA</text>
  </g>

  <!-- Certificate Main Content -->
  <g transform="translate(100, 180)">
    <text x="0" y="0" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="14" font-weight="300">This certificate is awarded to</text>
    <text x="0" y="40" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="30" letter-spacing="1">DOBARIYA NISARG SATISHBHAI</text>
    <line x1="0" y1="60" x2="600" y2="60" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <text x="0" y="95" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="13" font-weight="300">for successfully completing the 12-week course</text>
    <text x="0" y="130" fill="#ffd43b" font-family="sans-serif" font-weight="800" font-size="22" filter="url(#glow)">The Joy of Computing using Python</text>
    
    <!-- Score details -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="180" height="50" rx="4" fill="rgba(255,212,59,0.05)" stroke="rgba(255,212,59,0.2)" />
      <text x="90" y="20" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="10" text-anchor="middle">CONSOLIDATED SCORE</text>
      <text x="90" y="40" fill="#ffd43b" font-family="monospace" font-weight="700" font-size="16" text-anchor="middle" filter="url(#glow)">68 %</text>

      <text x="210" y="20" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">Recommended Credits: 3 or 4</text>
      <text x="210" y="40" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">Duration: Jan-Apr 2024 (12 Weeks)</text>
    </g>
  </g>

  <!-- Footer, Signatures, and Seal -->
  <g transform="translate(100, 440)">
    <!-- Signature Left -->
    <line x1="0" y1="30" x2="160" y2="30" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="80" y="48" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="10" text-anchor="middle">COURSE COORDINATOR</text>
    <text x="80" y="20" fill="#ffd43b" font-family="cursive" font-size="14" text-anchor="middle" opacity="0.8">NPTEL Board</text>
    
    <!-- Code ID Right -->
    <text x="600" y="25" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">ROLL NO: NPTEL24CS57S551100054</text>
    <text x="600" y="45" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">VERIFICATION URL: nptel.ac.in/noc</text>

    <!-- Badge Center -->
    <g transform="translate(320, -30)">
      <circle cx="30" cy="30" r="32" fill="rgba(255,212,59,0.05)" stroke="url(#nptelGlow)" stroke-width="2" />
      <circle cx="30" cy="30" r="14" fill="#ffd43b" filter="url(#glow)" />
    </g>
  </g>
</svg>
