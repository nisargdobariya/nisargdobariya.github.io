<svg width="800" height="565" viewBox="0 0 800 565" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ciscoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background border frame -->
  <rect x="0" y="0" width="800" height="565" fill="#0d0d12" rx="10" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <rect x="15" y="15" width="770" height="535" fill="none" stroke="rgba(0, 82, 255, 0.2)" stroke-width="1" rx="8" />

  <!-- Cisco Waves background graphic decoration -->
  <path d="M 50,450 Q 150,300 300,420 T 700,320" fill="none" stroke="rgba(0, 82, 255, 0.05)" stroke-width="6" />
  <path d="M 80,480 Q 200,340 350,450 T 750,350" fill="none" stroke="rgba(0, 240, 255, 0.03)" stroke-width="4" />

  <!-- Logo and Headers -->
  <g transform="translate(100, 80)">
    <!-- Cisco wave style logo -->
    <path d="M 0,25 L 0,5 M 8,25 L 8,-5 M 16,25 L 16,5 M 24,25 L 24,-10 M 32,25 L 32,5 M 40,25 L 40,-5 M 48,25 L 48,5" stroke="#00f0ff" stroke-width="3" filter="url(#glow)" />
    <text x="65" y="22" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="18" letter-spacing="1">CISCO</text>
    <text x="0" y="60" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11" letter-spacing="2">NETWORKING ACADEMY ACCREDITATION</text>
  </g>

  <!-- Certificate Main Content -->
  <g transform="translate(100, 200)">
    <text x="0" y="0" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="14" font-weight="300">This credential certifies that</text>
    <text x="0" y="45" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="36" letter-spacing="1">NISARG DOBARIYA</text>
    <line x1="0" y1="65" x2="600" y2="65" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <text x="0" y="100" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="14" font-weight="300">has successfully completed academic study and labs verification for</text>
    <text x="0" y="135" fill="url(#ciscoGlow)" font-family="sans-serif" font-weight="800" font-size="22" filter="url(#glow)">CCNA: Introduction to Networks &amp; Routing</text>
    <text x="0" y="165" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">Demonstrating practical knowledge of IP routing models, subnetting metrics, VLAN zones, OSPF,</text>
    <text x="0" y="182" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">switches configurations, packet parsing, and networking topology security protocols.</text>
  </g>

  <!-- Footer, Signatures, and Blue Badge -->
  <g transform="translate(100, 440)">
    <!-- Signature Left -->
    <line x1="0" y1="30" x2="160" y2="30" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="80" y="48" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="10" text-anchor="middle">ACADEMY INSTRUCTOR</text>
    <text x="80" y="20" fill="#0052ff" font-family="cursive" font-size="16" text-anchor="middle" opacity="0.8">Cisco Academy Board</text>
    
    <!-- Code ID Right -->
    <text x="600" y="25" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">ACADEMY VERIFICATION: CCNA-CIS-9810</text>
    <text x="600" y="45" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">DATE COMPLETED: NOVEMBER 2023</text>

    <!-- Badge Center -->
    <g transform="translate(320, -30)">
      <circle cx="30" cy="30" r="32" fill="rgba(0,82,255,0.05)" stroke="url(#ciscoGlow)" stroke-width="2" />
      <path d="M 22,20 L 30,12 L 38,20 L 38,40 L 30,48 L 22,40 Z" fill="none" stroke="url(#ciscoGlow)" stroke-width="2" filter="url(#glow)" />
      <circle cx="30" cy="30" r="4" fill="#00f0ff" />
    </g>
  </g>
</svg>
