<svg width="800" height="565" viewBox="0 0 800 565" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="thmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2c2c" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background border frame -->
  <rect x="0" y="0" width="800" height="565" fill="#0d0d12" rx="10" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <rect x="15" y="15" width="770" height="535" fill="none" stroke="rgba(255, 44, 44, 0.2)" stroke-width="1" rx="8" />

  <!-- Grid decoration lines -->
  <path d="M 40,40 L 100,40 M 40,40 L 40,100 M 760,40 L 700,40 M 760,40 L 760,100 M 40,525 L 100,525 M 40,525 L 40,465 M 760,525 L 700,525 M 760,525 L 760,465" stroke="#ff2c2c" stroke-width="2" filter="url(#glow)" fill="none" />

  <!-- Logo and Headers -->
  <g transform="translate(100, 80)">
    <text x="0" y="22" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="22" letter-spacing="1">TryHackMe</text>
    <circle cx="130" cy="14" r="8" fill="#ff2c2c" filter="url(#glow)" />
    <text x="0" y="60" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11" letter-spacing="2">TRYHACKME ACADEMIC LEARNING PATH</text>
  </g>

  <!-- Certificate Main Content -->
  <g transform="translate(100, 200)">
    <text x="0" y="0" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="14" font-weight="300">This is to acknowledge that</text>
    <text x="0" y="45" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="36" letter-spacing="1">NISARG DOBARIYA</text>
    <line x1="0" y1="65" x2="600" y2="65" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <text x="0" y="100" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="14" font-weight="300">has successfully completed the learning path</text>
    <text x="0" y="135" fill="#ff2c2c" font-family="sans-serif" font-weight="800" font-size="24" filter="url(#glow)">Pre Security</text>
    <text x="0" y="165" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">An essential foundation covering cyber fundamentals, networking protocols, Linux details,</text>
    <text x="0" y="182" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">web methodologies, and security concepts. (7 hours 38 minutes duration)</text>
  </g>

  <!-- Footer, Signatures, and Seal -->
  <g transform="translate(100, 440)">
    <!-- Signature Left -->
    <line x1="0" y1="30" x2="160" y2="30" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="80" y="48" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="10" text-anchor="middle">AUTHORIZED SIGNATURE</text>
    <text x="80" y="20" fill="#ff2c2c" font-family="cursive" font-size="14" text-anchor="middle" opacity="0.8">TryHackMe Board</text>
    
    <!-- Code ID Right -->
    <text x="600" y="25" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">CERTIFICATE NO: THM-RKMKVM77OA</text>
    <text x="600" y="45" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">DATE GRANTED: 5th January 2026</text>

    <!-- Badge Center -->
    <g transform="translate(320, -30)">
      <circle cx="30" cy="30" r="32" fill="rgba(255,44,44,0.05)" stroke="url(#thmGlow)" stroke-width="2" />
      <polygon points="30,10 34,22 46,22 37,28 40,40 30,32 20,40 23,28 14,22 26,22" fill="#ff2c2c" filter="url(#glow)" />
    </g>
  </g>
</svg>
