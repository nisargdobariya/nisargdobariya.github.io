<svg width="800" height="565" viewBox="0 0 800 565" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deloitteGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86bc25" />
      <stop offset="100%" stop-color="#0020ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background border frame -->
  <rect x="0" y="0" width="800" height="565" fill="#0d0d12" rx="10" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <rect x="15" y="15" width="770" height="535" fill="none" stroke="rgba(134, 188, 37, 0.2)" stroke-width="1" rx="8" />

  <!-- Logo and Headers -->
  <g transform="translate(100, 80)">
    <text x="0" y="22" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="22" letter-spacing="1">Deloitte.</text>
    <circle cx="95" cy="18" r="4" fill="#86bc25" filter="url(#glow)" />
    <text x="0" y="60" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11" letter-spacing="2">CYBERSECURITY JOB SIMULATION COMPLETION</text>
  </g>

  <!-- Certificate Main Content -->
  <g transform="translate(100, 200)">
    <text x="0" y="0" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="14" font-weight="300">This confirms that simulated corporate tasks were completed by</text>
    <text x="0" y="45" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="36" letter-spacing="1">NISARG DOBARIYA</text>
    <line x1="0" y1="65" x2="600" y2="65" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <text x="0" y="100" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="14" font-weight="300">for successfully executing simulated cyber exercises for</text>
    <text x="0" y="135" fill="#86bc25" font-family="sans-serif" font-weight="800" font-size="24" filter="url(#glow)">Deloitte Cyber Job Simulation</text>
    <text x="0" y="165" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">An intensive simulated program focusing on secure configurations, risk analysis, network flow metrics,</text>
    <text x="0" y="182" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">and corporate cyber defense protocols. Organized through Forage.</text>
  </g>

  <!-- Footer, Signatures, and Seal -->
  <g transform="translate(100, 440)">
    <!-- Signature Left -->
    <line x1="0" y1="30" x2="160" y2="30" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="80" y="48" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="10" text-anchor="middle">TINA MCCREERY</text>
    <text x="80" y="20" fill="#86bc25" font-family="cursive" font-size="13" text-anchor="middle" opacity="0.8">Chief Human Resources Officer, Deloitte</text>
    
    <!-- Code ID Right -->
    <text x="600" y="25" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">VERIFICATION CODE: Ej33pFXDKwNHuoW4F</text>
    <text x="600" y="45" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">DATE COMPLETED: June 26th, 2025</text>

    <!-- Badge Center -->
    <g transform="translate(320, -30)">
      <circle cx="30" cy="30" r="32" fill="rgba(134,188,37,0.05)" stroke="url(#deloitteGlow)" stroke-width="2" />
      <circle cx="30" cy="30" r="14" fill="#86bc25" filter="url(#glow)" />
    </g>
  </g>
</svg>
