<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="100%" stop-color="#14070a" />
    </linearGradient>
    <linearGradient id="bloodGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Navigation bar mock -->
  <rect x="20" y="20" width="760" height="50" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" />
  <text x="40" y="52" fill="#ff3366" font-family="sans-serif" font-weight="800" font-size="16" filter="url(#glow)">HEMO_VAULT</text>
  <rect x="650" y="32" width="110" height="26" rx="13" fill="rgba(255,51,102,0.1)" stroke="rgba(255,51,102,0.3)" />
  <text x="705" y="48" fill="#ff3366" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">INVENTORY_OK</text>

  <!-- Left inventory meters -->
  <g transform="translate(20, 90)">
    <rect x="0" y="0" width="340" height="370" rx="8" fill="rgba(10,10,12,0.6)" stroke="rgba(255,255,255,0.05)" />
    <text x="20" y="30" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-weight="700" font-size="13">CRITICAL STORAGE VOLUMES</text>

    <!-- Group A+ -->
    <g transform="translate(20, 60)">
      <text x="0" y="15" fill="#ffffff" font-family="monospace" font-weight="700" font-size="14">A-POSITIVE (A+)</text>
      <text x="300" y="15" fill="#ff3366" font-family="monospace" font-size="14" text-anchor="end" font-weight="700">85%</text>
      <rect x="0" y="25" width="300" height="8" rx="4" fill="rgba(255,255,255,0.05)" />
      <rect x="0" y="25" width="255" height="8" rx="4" fill="url(#bloodGlow)" filter="url(#glow)" />
    </g>

    <!-- Group O- -->
    <g transform="translate(20, 130)">
      <text x="0" y="15" fill="#ffffff" font-family="monospace" font-weight="700" font-size="14">O-NEGATIVE (O-)</text>
      <text x="300" y="15" fill="#ff3366" font-family="monospace" font-size="14" text-anchor="end" font-weight="700" filter="url(#glow)">24% [CRITICAL]</text>
      <rect x="0" y="25" width="300" height="8" rx="4" fill="rgba(255,255,255,0.05)" />
      <rect x="0" y="25" width="72" height="8" rx="4" fill="#ff3366" filter="url(#glow)" />
      <circle cx="72" cy="29" r="6" fill="#ffffff" />
    </g>

    <!-- Group B+ -->
    <g transform="translate(20, 200)">
      <text x="0" y="15" fill="#ffffff" font-family="monospace" font-weight="700" font-size="14">B-POSITIVE (B+)</text>
      <text x="300" y="15" fill="#ff3366" font-family="monospace" font-size="14" text-anchor="end" font-weight="700">62%</text>
      <rect x="0" y="25" width="300" height="8" rx="4" fill="rgba(255,255,255,0.05)" />
      <rect x="0" y="25" width="186" height="8" rx="4" fill="url(#bloodGlow)" />
    </g>

    <!-- Group AB- -->
    <g transform="translate(20, 270)">
      <text x="0" y="15" fill="#ffffff" font-family="monospace" font-weight="700" font-size="14">AB-NEGATIVE (AB-)</text>
      <text x="300" y="15" fill="#ff3366" font-family="monospace" font-size="14" text-anchor="end" font-weight="700">45%</text>
      <rect x="0" y="25" width="300" height="8" rx="4" fill="rgba(255,255,255,0.05)" />
      <rect x="0" y="25" width="135" height="8" rx="4" fill="url(#bloodGlow)" />
    </g>
  </g>

  <!-- Right transaction panels -->
  <g transform="translate(380, 90)">
    <rect x="0" y="0" width="400" height="370" rx="8" fill="rgba(10,10,12,0.6)" stroke="rgba(255,255,255,0.05)" />
    <text x="20" y="30" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-weight="700" font-size="13">PENDING HOSPITAL SHIPMENTS</text>

    <!-- Request Row 1 -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="360" height="80" rx="6" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.04)" />
      <text x="15" y="25" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="13">City Hospital (ICU Urgent)</text>
      <text x="15" y="45" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11">5 Units O-Negative (O-)</text>
      <text x="15" y="62" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10">ID: REQ-9810 // Priority: High</text>
      <rect x="260" y="25" width="85" height="26" rx="4" fill="rgba(255,51,102,0.1)" stroke="rgba(255,51,102,0.3)" />
      <text x="302" y="41" fill="#ff3366" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">CRITICAL</text>
    </g>

    <!-- Request Row 2 -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="360" height="80" rx="6" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.04)" />
      <text x="15" y="25" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="13">St. Jude Medical Center</text>
      <text x="15" y="45" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11">12 Units A-Positive (A+)</text>
      <text x="15" y="62" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10">ID: REQ-9808 // Priority: Routine</text>
      <rect x="260" y="25" width="85" height="26" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
      <text x="302" y="41" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">ROUTINE</text>
    </g>
    
    <!-- Request Row 3 -->
    <g transform="translate(20, 270)">
      <rect x="0" y="0" width="360" height="80" rx="6" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.04)" />
      <text x="15" y="25" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="13">Regional Trauma Center</text>
      <text x="15" y="45" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11">4 Units B-Positive (B+)</text>
      <text x="15" y="62" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10">ID: REQ-9807 // Priority: Dispatching</text>
      <rect x="260" y="25" width="85" height="26" rx="4" fill="rgba(0,255,102,0.1)" stroke="rgba(0,255,102,0.3)" />
      <text x="302" y="41" fill="#00ff66" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">DISPATCHED</text>
    </g>
  </g>
</svg>
