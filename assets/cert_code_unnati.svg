<svg width="800" height="565" viewBox="0 0 800 565" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sapGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background border frame -->
  <rect x="0" y="0" width="800" height="565" fill="#0d0d12" rx="10" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <rect x="15" y="15" width="770" height="535" fill="none" stroke="rgba(189, 0, 255, 0.2)" stroke-width="1" rx="8" />

  <!-- Logo and Headers -->
  <g transform="translate(100, 80)">
    <text x="0" y="22" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="20" letter-spacing="1">CODE UNNATI</text>
    <text x="0" y="45" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9" letter-spacing="1">A CSR INITIATIVE OF SAP &amp; EDUNET FOUNDATION</text>
  </g>

  <!-- Certificate Main Content -->
  <g transform="translate(100, 180)">
    <text x="0" y="0" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="13" font-weight="300">This certificate is proudly presented to</text>
    <text x="0" y="40" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="30" letter-spacing="1">NISARG DOBARIYA</text>
    <text x="0" y="65" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">from Charotar University of Science and Technology (CHARUSAT)</text>
    <line x1="0" y1="80" x2="600" y2="80" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <text x="0" y="115" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="13" font-weight="300">for participating in and successfully completing the training on</text>
    <text x="0" y="150" fill="url(#sapGlow)" font-family="sans-serif" font-weight="700" font-size="18" filter="url(#glow)">Emerging Technologies (ML, IoT, DL, CV, SAP ABAP on BTP)</text>
    <text x="0" y="180" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11">An advanced course covering Machine Learning algorithms, Internet of Things networking, Deep Learning,</text>
    <text x="0" y="196" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11">Computer Vision engines, and SAP ABAP development on Business Technology Platform during 2024-2025.</text>
  </g>

  <!-- Footer, Signatures, and Seal -->
  <g transform="translate(100, 440)">
    <!-- Signature Left -->
    <line x1="0" y1="30" x2="160" y2="30" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="80" y="48" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="10" text-anchor="middle">NAGESH SINGH</text>
    <text x="80" y="20" fill="#bd00ff" font-family="cursive" font-size="14" text-anchor="middle" opacity="0.8">Chairman, Edunet Foundation</text>
    
    <!-- Code ID Right -->
    <text x="600" y="25" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">CERTIFICATE ID: CU25_28570</text>
    <text x="600" y="45" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">CSR CO-INITIATIVE: SAP &amp; EDUNET</text>

    <!-- Badge Center -->
    <g transform="translate(320, -30)">
      <circle cx="30" cy="30" r="32" fill="rgba(189,0,255,0.05)" stroke="url(#sapGlow)" stroke-width="2" />
      <polygon points="30,8 35,22 48,22 38,30 42,42 30,34 18,42 22,30 12,22 25,22" fill="#00f0ff" filter="url(#glow)" />
    </g>
  </g>
</svg>
