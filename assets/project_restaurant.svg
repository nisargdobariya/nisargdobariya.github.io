<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="100%" stop-color="#070c14" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0052ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Navigation bar mock -->
  <rect x="20" y="20" width="760" height="50" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" />
  <text x="40" y="50" fill="#00f0ff" font-family="sans-serif" font-weight="800" font-size="16" filter="url(#glow)">GUSTO_OS</text>
  <rect x="680" y="32" width="80" height="26" rx="13" fill="rgba(0,240,255,0.1)" stroke="rgba(0,240,255,0.3)" />
  <text x="720" y="48" fill="#00f0ff" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">ADMIN_ROLE</text>

  <!-- Left Stats grid -->
  <g transform="translate(20, 90)">
    <!-- Card 1: Revenue -->
    <rect x="0" y="0" width="230" height="110" rx="8" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.05)" />
    <text x="20" y="30" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11">TOTAL REVENUE (TODAY)</text>
    <text x="20" y="65" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="24">$ 1,482.50</text>
    <text x="20" y="90" fill="#00ff66" font-family="sans-serif" font-size="11">+12.4% from yesterday</text>

    <!-- Card 2: Orders -->
    <rect x="0" y="130" width="230" height="110" rx="8" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.05)" />
    <text x="20" y="160" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11">ACTIVE TICKETS</text>
    <text x="20" y="195" fill="#00f0ff" font-family="sans-serif" font-weight="800" font-size="24" filter="url(#glow)">18 Orders</text>
    <text x="20" y="220" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="11">6 in preparation queue</text>

    <!-- Card 3: Tables -->
    <rect x="0" y="260" width="230" height="110" rx="8" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.05)" />
    <text x="20" y="290" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11">TABLE OCCUPANCY</text>
    <text x="20" y="325" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="24">82 %</text>
    <text x="20" y="350" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="11">22 of 28 Tables Active</text>
  </g>

  <!-- Right Order flow visualizer -->
  <g transform="translate(270, 90)">
    <rect x="0" y="0" width="510" height="370" rx="8" fill="rgba(10,10,12,0.6)" stroke="rgba(255,255,255,0.05)" />
    <text x="20" y="30" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-weight="700" font-size="13">LIVE KITCHEN TRACKING TERMINAL</text>

    <!-- Order Item Row 1 -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="470" height="80" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(0,240,255,0.15)" />
      <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14">Ticket #382 (Table 12)</text>
      <text x="20" y="55" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="11">2x Salmon Fillet, 1x Truffle Fries, 3x Sparkling Water</text>
      <rect x="360" y="25" width="90" height="30" rx="15" fill="rgba(0,240,255,0.1)" stroke="rgba(0,240,255,0.3)" />
      <text x="405" y="44" fill="#00f0ff" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700" filter="url(#glow)">PREPARING</text>
    </g>

    <!-- Order Item Row 2 -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="470" height="80" rx="6" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.05)" />
      <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14">Ticket #381 (Table 4)</text>
      <text x="20" y="55" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="11">1x Wagyu Ribeye Steak, 1x Caesar Salad</text>
      <rect x="360" y="25" width="90" height="30" rx="15" fill="rgba(0,255,102,0.1)" stroke="rgba(0,255,102,0.3)" />
      <text x="405" y="44" fill="#00ff66" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">READY</text>
    </g>

    <!-- Order Item Row 3 -->
    <g transform="translate(20, 260)">
      <rect x="0" y="0" width="470" height="80" rx="6" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.05)" />
      <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14">Ticket #380 (Table 18)</text>
      <text x="20" y="55" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="11">1x Neapolitan Pizza, 1x Pepperoni, 2x Cola</text>
      <rect x="360" y="25" width="90" height="30" rx="15" fill="rgba(189,0,255,0.1)" stroke="rgba(189,0,255,0.3)" />
      <text x="405" y="44" fill="#bd00ff" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">QUEUED</text>
    </g>
  </g>
</svg>
