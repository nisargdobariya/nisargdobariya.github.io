<svg width="800" height="565" viewBox="0 0 800 565" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dockerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2496ed" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background border frame -->
  <rect x="0" y="0" width="800" height="565" fill="#0d0d12" rx="10" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <rect x="15" y="15" width="770" height="535" fill="none" stroke="rgba(36, 150, 237, 0.2)" stroke-width="1" rx="8" />

  <!-- Docker Container box pattern decoration -->
  <g fill="none" stroke="rgba(36, 150, 237, 0.03)" stroke-width="2">
    <rect x="650" y="50" width="40" height="40" />
    <rect x="700" y="50" width="40" height="40" />
    <rect x="650" y="100" width="40" height="40" />
    <rect x="700" y="100" width="40" height="40" />
  </g>

  <!-- Logo and Headers -->
  <g transform="translate(100, 80)">
    <!-- Docker style whale stack logo mock -->
    <rect x="0" y="15" width="30" height="15" rx="3" fill="#2496ed" filter="url(#glow)" />
    <rect x="5" y="5" width="8" height="8" rx="1" fill="#00f0ff" />
    <rect x="17" y="5" width="8" height="8" rx="1" fill="#00f0ff" />
    <text x="45" y="22" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="18" letter-spacing="1">DOCKER</text>
    <text x="0" y="60" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11" letter-spacing="2">SYSTEM CONTAINERIZATION TRAINING</text>
  </g>

  <!-- Certificate Main Content -->
  <g transform="translate(100, 200)">
    <text x="0" y="0" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="14" font-weight="300">This certifies completion of containerized architecture syllabus by</text>
    <text x="0" y="45" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="36" letter-spacing="1">NISARG DOBARIYA</text>
    <line x1="0" y1="65" x2="600" y2="65" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <text x="0" y="100" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="14" font-weight="300">establishing proficiency in managing container layers for</text>
    <text x="0" y="135" fill="url(#dockerGlow)" font-family="sans-serif" font-weight="800" font-size="22" filter="url(#glow)">Docker System Orchestration Essentials</text>
    <text x="0" y="165" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">Mastering Dockerfile layers optimization, docker-compose orchestration networks, container</text>
    <text x="0" y="182" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">volumes mapping, registry deployments, and securing container daemons in hosts.</text>
  </g>

  <!-- Footer, Signatures, and Blue Badge -->
  <g transform="translate(100, 440)">
    <!-- Signature Left -->
    <line x1="0" y1="30" x2="160" y2="30" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="80" y="48" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="10" text-anchor="middle">REGISTRY INSTRUCTOR</text>
    <text x="80" y="20" fill="#2496ed" font-family="cursive" font-size="16" text-anchor="middle" opacity="0.8">Systems Training Board</text>
    
    <!-- Code ID Right -->
    <text x="600" y="25" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">DOCKER-ID: DK-SYS-82910</text>
    <text x="600" y="45" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">DATE GRANTED: APRIL 2024</text>

    <!-- Badge Center -->
    <g transform="translate(320, -30)">
      <circle cx="30" cy="30" r="32" fill="rgba(36,150,237,0.05)" stroke="url(#dockerGlow)" stroke-width="2" />
      <!-- Drawing whale outline in simple lines -->
      <path d="M 18,34 Q 30,22 42,34 C 45,34 45,28 42,28 M 18,34 C 15,34 15,30 18,30" stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#glow)" />
    </g>
  </g>
</svg>
