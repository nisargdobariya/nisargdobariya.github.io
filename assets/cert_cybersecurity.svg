<svg width="800" height="565" viewBox="0 0 800 565" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background border frame -->
  <rect x="0" y="0" width="800" height="565" fill="#0d0d12" rx="10" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <rect x="15" y="15" width="770" height="535" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" rx="8" />

  <!-- Grid decoration lines -->
  <path d="M 40,40 L 100,40 M 40,40 L 40,100 M 760,40 L 700,40 M 760,40 L 760,100 M 40,525 L 100,525 M 40,525 L 40,465 M 760,525 L 700,525 M 760,525 L 760,465" stroke="#00f0ff" stroke-width="2" filter="url(#glow)" fill="none" />

  <!-- Logo and Headers -->
  <g transform="translate(100, 80)">
    <!-- Google Colors -->
    <rect x="0" y="0" width="12" height="12" fill="#4285F4" />
    <rect x="16" y="0" width="12" height="12" fill="#EA4335" />
    <rect x="0" y="16" width="12" height="12" fill="#FBBC05" />
    <rect x="16" y="16" width="12" height="12" fill="#34A853" />
    
    <text x="40" y="22" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="18" letter-spacing="1">Google</text>
    <text x="0" y="60" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11" letter-spacing="2">VERIFIED ONLINE NON-CREDIT COURSE</text>
  </g>

  <!-- Certificate Main Content -->
  <g transform="translate(100, 200)">
    <text x="0" y="0" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="14" font-weight="300">This is to officially confirm that</text>
    <text x="0" y="45" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="36" letter-spacing="1">NISARG DOBARIYA</text>
    <line x1="0" y1="65" x2="600" y2="65" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <text x="0" y="100" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="14" font-weight="300">has successfully completed all course requirements for</text>
    <text x="0" y="135" fill="#00f0ff" font-family="sans-serif" font-weight="800" font-size="22" filter="url(#glow)">Foundations of Cybersecurity</text>
    <text x="0" y="165" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">An online non-credit course authorized by Google and offered through Coursera,</text>
    <text x="0" y="182" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">confirming the identity and active participation of this individual.</text>
  </g>

  <!-- Footer, Signatures, and Gold Badge -->
  <g transform="translate(100, 440)">
    <!-- Signature Left -->
    <line x1="0" y1="30" x2="160" y2="30" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="80" y="48" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="10" text-anchor="middle">AMANDA BROPHY</text>
    <text x="80" y="20" fill="#00f0ff" font-family="cursive" font-size="14" text-anchor="middle" opacity="0.8">Global Director, Google Career Certs</text>
    
    <!-- Code ID Right -->
    <text x="600" y="25" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">CREDENTIAL ID: RBC4XNJFJJU2</text>
    <text x="600" y="45" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">VERIFICATION URL: coursera.org/verify/RBC4XNJFJJU2</text>

    <!-- Badge Center -->
    <g transform="translate(320, -30)">
      <circle cx="30" cy="30" r="32" fill="rgba(0,240,255,0.05)" stroke="url(#goldGlow)" stroke-width="2" />
      <polygon points="30,8 36,20 49,20 39,29 43,42 30,34 17,42 21,29 11,20 24,20" fill="url(#goldGlow)" filter="url(#glow)" />
      <path d="M 30,48 L 22,62 L 30,58 L 38,62 Z" fill="url(#goldGlow)" opacity="0.8" />
    </g>
  </g>
</svg>
